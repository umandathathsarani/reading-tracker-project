<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reading Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <nav>
        <a href="#" onclick="loadPage('dashboard')">Dashboard</a>
        <a href="#" onclick="loadPage('library')">Library</a>
        <a href="#" onclick="loadPage('add')">Add New</a>
        <a href="#" onclick="loadPage('reading')">Reading List</a>
        <a href="#" onclick="loadPage('profile')">Profile</a>
    </nav>

    <div class="container">
        <header>
            <h1>My Reading Tracker</h1>
            <p>Track your books, webnovels, and fanfics</p>
        </header>

        <div id="app-content"></div>

    </div>

    <div id="custom-alert-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3 id="custom-alert-title">Notification</h3>
            <p id="custom-alert-message">Success message text</p>
            <button onclick="closeAlertModal()">OK</button>
        </div>
    </div>

    <div id="custom-quote-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3>Add Favorite Line</h3>
            <p style="font-size: 14px; color: #64748b; margin-top: -5px;">Save a memorable line and track where it came from.</p>
            <form id="modal-quote-form">
                <input type="text" id="modal-quote-text" placeholder="Enter your favorite line..." required>
                <input type="number" id="modal-quote-page" placeholder="Page / Chapter number" required>
                <div class="modal-buttons">
                    <button type="button" class="btn-secondary" onclick="closeQuoteModal()">Cancel</button>
                    <button type="submit">Save Quote</button>
                </div>
            </form>
        </div>
    </div>

    <div id="custom-edit-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3>Edit Story</h3>
            <form id="edit-story-form">
                <input type="hidden" id="edit-id"> 
                
                <input type="text" id="edit-title" placeholder="Story Title" required>
                <input type="text" id="edit-author" placeholder="Author" required>
                
                <div class="form-row">
                    <input type="text" id="edit-platform" placeholder="Platform" required>
                    <input type="text" id="edit-genre" placeholder="Genre" required>
                </div>

                <select id="edit-status" required>
                    <option value="Currently Reading">Currently Reading</option>
                    <option value="Waiting for Update">Waiting for Update</option>
                    <option value="Completed">Completed</option>
                </select>

                <div class="modal-buttons">
                    <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancel</button>
                    <button type="submit">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <div id="custom-confirm-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3 id="confirm-title">Confirm Action</h3>
            <p id="confirm-message">Are you sure you want to proceed?</p>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" onclick="closeConfirmModal()">Cancel</button>
                <button type="button" class="btn-delete" id="confirm-action-btn">Confirm</button>
            </div>
        </div>
    </div>

    <div id="custom-edit-quote-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3>Edit Favorite Line</h3>
            <form id="modal-edit-quote-form">
                <input type="text" id="modal-edit-quote-text" required>
                <input type="number" id="modal-edit-quote-page" required>
                <div class="modal-buttons">
                    <button type="button" class="btn-secondary" onclick="closeEditQuoteModal()">Cancel</button>
                    <button type="submit">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
